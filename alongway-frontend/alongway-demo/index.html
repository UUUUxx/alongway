  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body {
      background: #FFF8E6;
      color: #17140F;
      font-family: 'Noto Sans SC', 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100dvh;
      margin: 0;
    }

    /* ─── City street background texture ───────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(243,231,200,0.25) 1px, transparent 1px),
        linear-gradient(90deg, rgba(243,231,200,0.25) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.6;
    }

    /* ─── Ticket voucher styling ───────────────────────── */
    .ticket-card {
      position: relative;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }
    .ticket-card::before,
    .ticket-card::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      background: #FFF8E6;
      border-radius: 50%;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
    }
    .ticket-card::before { left: -10px; }
    .ticket-card::after { right: -10px; }

    .ticket-divider {
      border-top: 2px dashed rgba(23,20,15,0.08);
      margin: 0 -16px;
      padding: 0 16px;
    }

    /* ─── Serrated edge for deal cards ─────────────────── */
    .deal-ticket {
      position: relative;
      background: white;
      border-radius: 12px;
      overflow: visible;
    }
    .deal-ticket::before,
    .deal-ticket::after {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      background: #FFF8E6;
      border-radius: 50%;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
    }
    .deal-ticket::before { left: -8px; }
    .deal-ticket::after { right: -8px; }

    .deal-ticket-inner {
      position: relative;
      overflow: hidden;
    }
    .deal-ticket-inner::before {
      content: '';
      position: absolute;
      left: 33%; top: -1px; bottom: -1px;
      width: 1px;
      background: repeating-linear-gradient(
        to bottom,
        rgba(23,20,15,0.08) 0px,
        rgba(23,20,15,0.08) 4px,
        transparent 4px,
        transparent 8px
      );
    }

    /* ─── Animations ──────────────────────────────────── */
    @keyframes fadeInUp { 0% { opacity:0; transform:translateY(16px); } 100% { opacity:1; transform:translateY(0); } }
    @keyframes fadeInScale { 0% { opacity:0; transform:scale(0.92); } 100% { opacity:1; transform:scale(1); } }
    @keyframes bounceIn { 0% { opacity:0; transform:scale(0); } 50% { transform:scale(1.12); } 100% { opacity:1; transform:scale(1); } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes drawLine { 0% { stroke-dashoffset: 1200; } 100% { stroke-dashoffset: 0; } }
    @keyframes pulseDot { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(1.5); opacity:0.4; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes glowPulse { 0%,100% { box-shadow: 0 0 8px rgba(255,209,0,0.2); } 50% { box-shadow: 0 0 20px rgba(255,209,0,0.35), 0 0 40px rgba(255,209,0,0.1); } }
    @keyframes routeFlow { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -24; } }
    @keyframes softFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes sheen { 0% { left: -100%; } 50%,100% { left: 100%; } }
    @keyframes slideInRight { 0% { opacity:0; transform:translateX(20px); } 100% { opacity:1; transform:translateX(0); } }
    @keyframes slideInUp { 0% { opacity:0; transform:translateY(20px); } 100% { opacity:1; transform:translateY(0); } }
    @keyframes ticketPrint { 0% { opacity:0; transform:translateY(-10px) scale(0.98); } 100% { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes toastIn { 0% { opacity:0; transform:translateY(16px) scale(0.95); } 100% { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes toastOut { 0% { opacity:1; transform:translateY(0) scale(1); } 100% { opacity:0; transform:translateY(-8px) scale(0.95); } }
    @keyframes stampPress { 0% { transform:scale(1.3) rotate(-8deg); opacity:0; } 60% { transform:scale(0.95) rotate(2deg); opacity:1; } 100% { transform:scale(1) rotate(0deg); opacity:1; } }
    @keyframes tagPop { 0% { transform:scale(0.9); } 50% { transform:scale(1.08); } 100% { transform:scale(1); } }
    @keyframes scanLine { 0% { top: -2px; } 100% { top: 100%; } }

    .animate-fade-in-up { animation: fadeInUp 0.5s cubic-bezier(0.22,1,0.36,1) both; }
    .animate-fade-in-scale { animation: fadeInScale 0.4s cubic-bezier(0.22,1,0.36,1) both; }
    .animate-slide-in-right { animation: slideInRight 0.4s cubic-bezier(0.22,1,0.36,1) both; }
    .animate-ticket-print { animation: ticketPrint 0.5s cubic-bezier(0.22,1,0.36,1) both; }
    .animate-bounce-in { animation: bounceIn 0.4s cubic-bezier(0.68,-0.55,0.265,1.55) both; }
    .animate-stamp { animation: stampPress 0.5s cubic-bezier(0.22,1,0.36,1) both; }
    .stagger-1 { animation-delay: 0.05s; } .stagger-2 { animation-delay: 0.10s; }
    .stagger-3 { animation-delay: 0.15s; } .stagger-4 { animation-delay: 0.20s; }
    .stagger-5 { animation-delay: 0.25s; } .stagger-6 { animation-delay: 0.30s; }

    .route-path { stroke-dasharray: 1200; stroke-dashoffset: 1200; transition: stroke-dashoffset 2s cubic-bezier(0.22,1,0.36,1); }
    .route-path.drawn { stroke-dashoffset: 0; }
    .route-flow { animation: routeFlow 1.5s linear infinite; }

    .card-hover-lift { transition: transform 0.3s cubic-bezier(0.22,1,0.36,1), box-shadow 0.3s ease, border-color 0.3s ease; }
    .card-hover-lift:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(23,20,15,0.1), 0 2px 6px rgba(23,20,15,0.05); }
    .card-hover-lift:active { transform: translateY(-1px) scale(0.995); }

    .btn-press { transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.2s ease; }
    .btn-press:hover { transform: translateY(-1px); }
    .btn-press:active { transform: translateY(1px) scale(0.97); box-shadow: inset 0 2px 4px rgba(23,20,15,0.15); }

    .sheen-wrap { position: relative; overflow: hidden; }
    .sheen-wrap::after { content:''; position:absolute; top:0; left:-100%; width:50%; height:100%; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); }
    .sheen-wrap:hover::after { animation: sheen 0.6s ease-out; }

    .search-glow { transition: box-shadow 0.35s ease, border-color 0.35s ease; }
    .search-glow:focus-within { box-shadow: 0 0 0 3px rgba(255,209,0,0.2), 0 0 24px rgba(255,209,0,0.12); }

    .pref-tag {
      transition: all 0.2s cubic-bezier(0.22,1,0.36,1);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .pref-tag:hover { transform: translateY(-2px); }
    .pref-tag:active { transform: translateY(0) scale(0.95); }
    .pref-tag[data-active="true"] { animation: glowPulse 3s ease-in-out infinite; }
    .pref-tag[data-active="true"]:active { animation: tagPop 0.3s ease; }

    .example-card {
      transition: all 0.25s cubic-bezier(0.22,1,0.36,1);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .example-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(23,20,15,0.08); }
    .example-card:active { transform: scale(0.97); }

    .data-capsule {
      animation: fadeInUp 0.5s cubic-bezier(0.22,1,0.36,1) both;
      transition: transform 0.2s ease;
    }
    .data-capsule:hover { transform: scale(1.03); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D9D2C3; border-radius: 100px; }

    .particle-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    /* Toast notification */
    .toast-enter { animation: toastIn 0.3s cubic-bezier(0.22,1,0.36,1) both; }
    .toast-exit { animation: toastOut 0.25s ease both; }

    /* Hero background pattern */
    .hero-pattern {
      background-image:
        radial-gradient(circle at 20% 80%, rgba(255,209,0,0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255,77,61,0.05) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(16,185,129,0.04) 0%, transparent 60%);
    }

    /* Ticket stamp effect */
    .stamp-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border: 1.5px solid;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      .particle-canvas { display: none; }
      .route-flow { animation: none; }
      .card-hover-lift:hover { transform: none; }
      .btn-press:hover, .btn-press:active { transform: none; }
      .pref-tag:hover, .pref-tag:active { transform: none; }
      .example-card:hover, .example-card:active { transform: none; }
      .data-capsule:hover { transform: none; }
    }
  </style>
</head>

            rating: 4.4, cost: 22, detour_meters: 60, detour_time_min: 1,
            recommend_score: 0.85, recommend_reason: "到达前顺手带一杯，几乎零绕路",
            deals: [{
              deal_id: "deal-004", deal_title: "多肉葡萄+烤黑糖波波", price: 24.9,
              original_price: 36, category: "茶饮", monthly_sales: 8900, rating: 4.5,

    };

    const EXAMPLE_QUERIES = [
      { text: "从武大去光谷，顺路找点吃的", tag: "饭点灵感", icon: "🍜" },
      { text: "从汉口火车站到江汉路，想喝杯咖啡", tag: "路过歇脚", icon: "☕" },

      { text: "从街道口到光谷步行街，找点甜品", tag: "下午茶", icon: "🍰" },
    ];

    // ─── API CLIENT (unchanged) ────────────────────────────────────
    const USE_MOCK = false;
    const BASE_URL = 'http://127.0.0.1:8000';

    const LOCATION_MAP = {
      '武汉大学':   { longitude: 114.3645, latitude: 30.5378, address: '珞珈山路16号' },
      '光谷广场':   { longitude: 114.4052, latitude: 30.5078, address: '珞喻路726号' },
      '光谷步行街': { longitude: 114.3990, latitude: 30.5110, address: '光谷步行街1期' },
      '汉口火车站': { longitude: 114.2580, latitude: 30.6180, address: '发展大道188号' },
      '江汉路':     { longitude: 114.2830, latitude: 30.5820, address: '江汉路步行街' },
      '街道口':     { longitude: 114.3820, latitude: 30.5280, address: '珞喻路街道口' },
    };

    function generateUUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = (Math.random() * 16) | 0;
        return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
      });
    }

    function extractLocation(query) {
      for (const [name, loc] of Object.entries(LOCATION_MAP)) {
        if (query.includes(name)) return { name, ...loc };
      }
      return null;
    }

    async function submitPlan({ userQuery, travelMode = 'walking', budget, preferences }) {
      if (USE_MOCK) {
        await new Promise(r => setTimeout(r, 1800 + Math.random() * 1200));
        return MOCK_PLAN_RESULT;
      }

      const match = userQuery.match(/从(.+?)(?:到|去|→|前往)(.+)/);
      let start, end;
      if (match) {
        start = extractLocation(match[1]) || Object.values(LOCATION_MAP)[0];
        end = extractLocation(match[2]) || Object.values(LOCATION_MAP)[1];
      } else {
        start = Object.values(LOCATION_MAP)[0];
        end = Object.values(LOCATION_MAP)[1];
      }

      const payload = {
        request_id: generateUUID(),
        user_query: userQuery,
        start_location: { name: start.name, address: start.address, location: start.name, longitude: start.longitude, latitude: start.latitude },
        end_location: { name: end.name, address: end.address, location: end.name, longitude: end.longitude, latitude: end.latitude },
        city: '武汉',
        travel_mode: travelMode,
        ...(budget && { budget }),
        ...(preferences && { preferences }),
      };

      const res = await fetch(`${BASE_URL}/api/plan`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || `请求失败 (${res.status})`);
      }
      return res.json();
    }

    // ─── PARTICLE FIELD ────────────────────────────────────────────
    function ParticleField({ intensity = 1 }) {
      const canvasRef = useRef(null);
      const animRef = useRef(null);

      useEffect(() => {
        if (prefersReducedMotion) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const isMobile = window.innerWidth < 640;
        const maxCount = isMobile ? 30 : 60;
        const count = Math.round(maxCount * intensity);

        let w, h;
        const resize = () => {
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
        };
        resize();
        window.addEventListener('resize', resize);

        const particles = [];
        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * w,
            y: Math.random() * h,
            vx: (Math.random() - 0.5) * 0.25,
            vy: (Math.random() - 0.5) * 0.15 - 0.08,
            r: Math.random() * 1.5 + 0.5,
            alpha: Math.random() * 0.2 + 0.03,
            pulse: Math.random() * Math.PI * 2,
            pulseSpeed: Math.random() * 0.012 + 0.004,
          });
        }

        const lineColor = 'rgba(255,209,0,';
        const dotColor = 'rgba(255,209,0,';
        const linkDist = isMobile ? 80 : 110;

        const draw = () => {
          ctx.clearRect(0, 0, w, h);

          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx; p.y += p.vy; p.pulse += p.pulseSpeed;
            if (p.x < -10) p.x = w + 10;
            if (p.x > w + 10) p.x = -10;
            if (p.y < -10) p.y = h + 10;
            if (p.y > h + 10) p.y = -10;

            const alpha = p.alpha * (0.6 + 0.4 * Math.sin(p.pulse));
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = dotColor + alpha + ')';
            ctx.fill();

            for (let j = i + 1; j < particles.length; j++) {
              const q = particles[j];
              const dx = p.x - q.x, dy = p.y - q.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < linkDist) {
                const la = (1 - dist / linkDist) * 0.06;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(q.x, q.y);
                ctx.strokeStyle = lineColor + la + ')';
                ctx.lineWidth = 0.5;
                ctx.stroke();
              }
            }
          }
          animRef.current = requestAnimationFrame(draw);
        };

        draw();
        return () => {
          window.removeEventListener('resize', resize);
          if (animRef.current) cancelAnimationFrame(animRef.current);
        };
      }, [intensity]);

      if (prefersReducedMotion) return null;
      return <canvas ref={canvasRef} className="particle-canvas" />;
    }

    // ─── MAP VIEW (warm city street style) ─────────────────────────
    function normalizeCoords(waypoints) {
      const lngs = waypoints.map(w => w.longitude), lats = waypoints.map(w => w.latitude);
      const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
      const minLat = Math.min(...lats), maxLat = Math.max(...lats);
      const padLng = (maxLng - minLng) * 0.2 || 0.01, padLat = (maxLat - minLat) * 0.2 || 0.01;
      return waypoints.map(w => ({
        ...w,
        x: 60 + ((w.longitude - minLng + padLng) / (maxLng - minLng + 2 * padLng)) * 480,
        y: 40 + (1 - (w.latitude - minLat + padLat) / (maxLat - minLat + 2 * padLat)) * 280,
      }));
    }

    function smoothPath(points) {
      if (points.length < 2) return '';
      let d = `M ${points[0].x} ${points[0].y}`;
      for (let i = 1; i < points.length; i++) {
        const prev = points[i-1], curr = points[i];
        const cpx1 = prev.x + (curr.x - prev.x) * 0.5, cpx2 = prev.x + (curr.x - prev.x) * 0.5;
        d += ` C ${cpx1} ${prev.y}, ${cpx2} ${curr.y}, ${curr.x} ${curr.y}`;
      }
      return d;
    }

    function MapView({ waypoints }) {
      const [drawn, setDrawn] = useState(false);
      useEffect(() => { const t = setTimeout(() => setDrawn(true), 100); return () => clearTimeout(t); }, []);
      const points = normalizeCoords(waypoints);
      const pathD = smoothPath(points);
      const colors = { origin: '#10B981', destination: '#FF4D3D', poi: '#FFD100' };

      return (
        <div className="relative w-full rounded-2xl overflow-hidden border border-mt-street" style={{background:'linear-gradient(135deg, #FFF8E6 0%, #F3E7C8 100%)'}}>

            </defs>
            <rect width="600" height="360" fill="#FFF8E6"/>
            <rect width="600" height="360" fill="url(#grid)"/>
            {/* city blocks - warm beige buildings */}
            {[[40,30,120,80],[180,20,90,100],[300,40,110,70],[440,30,100,90],[60,160,100,60],[200,150,130,70],[360,170,100,80],[80,260,120,60],[250,280,100,50],[400,250,130,70]].map(([x,y,w,h],i) => (
              <rect key={i} x={x} y={y} width={w} height={h} rx="4" fill={i%3===0?'#F3E7C8':'#EDE9DF'} stroke="rgba(23,20,15,0.06)" strokeWidth="0.5" filter="url(#buildingShadow)"/>
            ))}
            {/* street trees */}

              </g>
            ))}
            {/* route glow */}
            <path d={pathD} fill="none" stroke="rgba(255,209,0,0.15)" strokeWidth="18" strokeLinecap="round" filter="url(#routeGlow)"/>
            {/* route shadow */}
            <path d={pathD} fill="none" stroke="rgba(255,209,0,0.2)" strokeWidth="10" strokeLinecap="round"/>
            {/* route line */}
            <path d={pathD} fill="none" stroke="#FFD100" strokeWidth="4" strokeLinecap="round" className={`route-path ${drawn ? 'drawn' : ''}`}/>
            {/* flowing dash overlay */}

            {/* traveling light dots */}
            {drawn && !prefersReducedMotion && [0,1,2].map(i => (
              <circle key={`dot-${i}`} r="3" fill="#FFD100" stroke="white" strokeWidth="1.5">
                <animateMotion dur={`${3 + i * 1.2}s`} repeatCount="indefinite" begin={`${i * 1}s`}>
                  <mpath href={`#routeMotionPath`}/>
                </animateMotion>
              </circle>
            ))}
            <path id="routeMotionPath" d={pathD} fill="none" stroke="none"/>
            {/* markers */}
            {points.map((p, i) => {
              const isEnd = p.type === 'origin' || p.type === 'destination';
              const color = colors[p.type] || colors.poi;
              const size = isEnd ? 11 : 7;

                      {p.type==='origin'?'🟢 ':p.type==='destination'?'🔴 ':<span style={{color:'#FFD100',fontWeight:700,marginRight:'2px'}}>{p.order}.</span>}{p.name}
                    </div>
                  </foreignObject>
                </g>
              );
            })}
          </svg>
          <div className="absolute bottom-3 right-3">
            <div className="bg-white/95 backdrop-blur-sm px-2.5 py-1 rounded-lg text-[10px] text-ink-400 font-medium shadow-sm border border-mt-street/40">示意图 · 非精确地图</div>
          </div>
        </div>
      );

    // ─── LOADING OVERLAY (route building + ticket printing) ────────
    const LOADING_STEPS = [
      { text: '分析你的出行需求...', sub: '理解起点终点和偏好', icon: '🔍' },
      { text: '扫过沿途好店...', sub: '寻找最佳 POI 和团购', icon: '🏪' },
      { text: '核算绕路时间...', sub: '规划最优步行路线', icon: '🗺️' },
      { text: '匹配可用团购券...', sub: '即将为你出票', icon: '🎫' },
    ];

    function LoadingOverlay() {
      const [step, setStep] = useState(0);
      const canvasRef = useRef(null);
      const animRef = useRef(null);

      useEffect(() => {
        const t1 = setTimeout(() => setStep(1), 800);
        const t2 = setTimeout(() => setStep(2), 2000);
        const t3 = setTimeout(() => setStep(3), 3200);
        return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); };
      }, []);

      useEffect(() => {
        if (prefersReducedMotion) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const w = 280, h = 280;
        canvas.width = w; canvas.height = h;

        const nodes = [
          { x: 60, y: 220, r: 9, color: '#10B981', label: '起点' },
          { x: 110, y: 160, r: 6, color: '#FFD100', label: '' },
          { x: 170, y: 100, r: 6, color: '#FFD100', label: '' },
          { x: 220, y: 180, r: 6, color: '#FFD100', label: '' },
          { x: 200, y: 60, r: 9, color: '#FF4D3D', label: '终点' },
        ];

        const particles = [];
        for (let i = 0; i < 12; i++) {
          particles.push({ t: Math.random() * 4, speed: 0.008 + Math.random() * 0.006, alpha: 0.3 + Math.random() * 0.5 });
        }

        let frame = 0;
        const draw = () => {
          ctx.clearRect(0, 0, w, h);
          frame++;

          const progress = Math.min(1, frame / 120);
          const visibleSegments = Math.floor(progress * (nodes.length - 1));

          for (let i = 0; i < visibleSegments && i < nodes.length - 1; i++) {
            const a = nodes[i], b = nodes[i + 1];
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = 'rgba(255,209,0,0.25)'; ctx.lineWidth = 2; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = 'rgba(255,209,0,0.06)'; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.stroke();
          }

          if (visibleSegments < nodes.length - 1 && frame > 20) {
            const idx = visibleSegments;
            const a = nodes[idx], b = nodes[idx + 1];
            const segProgress = Math.min(1, (progress * (nodes.length - 1)) - idx);
            const mx = a.x + (b.x - a.x) * segProgress, my = a.y + (b.y - a.y) * segProgress;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mx, my);
            ctx.strokeStyle = 'rgba(255,209,0,0.6)'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();
            ctx.beginPath(); ctx.arc(mx, my, 5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,209,0,0.7)'; ctx.fill();
          }

          for (let i = 0; i < nodes.length; i++) {
            const n = nodes[i];
            const nodeProgress = progress * (nodes.length - 1);
            if (i > nodeProgress + 0.5) continue;
            const pulseR = n.r + 4 + Math.sin(frame * 0.04 + i) * 3;
            ctx.beginPath(); ctx.arc(n.x, n.y, pulseR, 0, Math.PI * 2);
            ctx.fillStyle = n.color + '15'; ctx.fill();
            ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
            ctx.fillStyle = n.color; ctx.fill();
            if (n.r > 6) {
              ctx.beginPath(); ctx.arc(n.x, n.y, n.r - 3.5, 0, Math.PI * 2);
              ctx.fillStyle = 'white'; ctx.fill();
            }
            if (n.label) {
              ctx.font = '600 10px Noto Sans SC, sans-serif';
              ctx.fillStyle = '#6B6155'; ctx.textAlign = 'center';
              ctx.fillText(n.label, n.x, n.y + n.r + 15);
            }
          }

          if (visibleSegments > 0) {
            for (const p of particles) {
              p.t += p.speed;
              if (p.t > visibleSegments) p.t = 0;
              const segIdx = Math.floor(p.t);
              if (segIdx >= nodes.length - 1) continue;
              const a = nodes[segIdx], b = nodes[segIdx + 1];
              const frac = p.t - segIdx;
              const px = a.x + (b.x - a.x) * frac, py = a.y + (b.y - a.y) * frac;
              ctx.beginPath(); ctx.arc(px, py, 2.5, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(255,209,0,${p.alpha})`; ctx.fill();
            }
          }

          animRef.current = requestAnimationFrame(draw);
        };

        draw();
        return () => { if (animRef.current) cancelAnimationFrame(animRef.current); };
      }, []);

      return (
        <div className="fixed inset-0 z-[100] bg-mt-rice/95 backdrop-blur-md flex items-center justify-center p-4">
          <div className="w-full max-w-sm text-center">
            <div className="relative w-[280px] h-[280px] mx-auto mb-6">
              <canvas ref={canvasRef} className="w-full h-full" style={{ borderRadius: '50%' }}/>
              {!prefersReducedMotion && (
                <div className="absolute inset-0 flex items-center justify-center pointer-events-none" style={{animation:'float 3s ease-in-out infinite'}}>
                  <div className="w-14 h-14 rounded-full bg-mt-yellow/15 flex items-center justify-center border-2 border-mt-yellow/30" style={{animation:'glowPulse 2s ease-in-out infinite'}}>
                    <Icons.Navigation className="w-6 h-6 text-mt-yellow-dark"/>
                  </div>
                </div>
              )}
            </div>
            <div className="space-y-2.5 mb-6">
              {LOADING_STEPS.map((s, i) => (
                <div key={i} className={`flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-500 ${i===step?'bg-mt-yellow/10 border border-mt-yellow/40 shadow-sm':i<step?'opacity-50':'opacity-30'}`} style={i===step?{animation:'slideInRight 0.3s ease'}:{}}>
                  <div className={`w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0 text-sm ${i<step?'bg-mt-yellow text-ink-900':i===step?'bg-mt-yellow text-ink-900':'bg-mt-street text-ink-400'}`} style={i===step?{animation:'pulseDot 2s ease-in-out infinite'}:{}}>
                    {i<step ? <Icons.Check className="w-4 h-4"/> : s.icon}
                  </div>
                  <div className="text-left">
                    <div className="text-sm font-medium text-ink-800">{s.text}</div>
                    <div className="text-[11px] text-ink-400">{s.sub}</div>
                  </div>
                </div>
              ))}
            </div>
            <div className="flex items-center justify-center gap-2">
              <div className="w-1.5 h-1.5 rounded-full bg-mt-yellow" style={{animation:'pulseDot 1s ease-in-out infinite'}}/>
              <div className="w-1.5 h-1.5 rounded-full bg-mt-yellow" style={{animation:'pulseDot 1s ease-in-out 0.3s infinite'}}/>
              <div className="w-1.5 h-1.5 rounded-full bg-mt-yellow" style={{animation:'pulseDot 1s ease-in-out 0.6s infinite'}}/>
            </div>
          </div>
        </div>
      );
    }

                      disabled={loading} aria-label="输入你的行程需求"/>
                    <button type="submit" disabled={!query.trim() || loading}
                      className={`flex-shrink-0 w-10 h-10 rounded-xl flex items-center justify-center transition-all duration-200 shadow-sm cursor-pointer btn-press ${!query.trim() || loading ? 'bg-mt-street text-ink-400 cursor-not-allowed' : 'bg-mt-yellow hover:bg-mt-yellow-dark text-ink-900'}`}
                      aria-label="搜索">
                      <Icons.Search className="w-4 h-4"/>
                    </button>
                  </div>
                </div>
              </div>
              <div className="mt-4">
                <p className="text-xs text-ink-400 mb-2 font-medium">偏好设置</p>
                <PreferenceTags preferences={preferences} onChange={setPreferences}/>
              </div>
            </form>

            {/* Example queries (hot search / inspiration cards) */}
            <div className={`mt-6 w-full max-w-lg transition-all duration-700 ${mounted ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'}`} style={{transitionDelay:'400ms'}}>
              <div className="flex items-center gap-1.5 mb-3">
                <Icons.Fire className="w-3.5 h-3.5 text-mt-deal-red"/>
                <p className="text-xs text-ink-500 font-semibold">附近热搜</p>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                {EXAMPLE_QUERIES.map((ex, i) => (
                  <button key={i} onClick={() => { setQuery(ex.text); inputRef.current?.focus(); }}
                    className="example-card flex items-center gap-3 bg-white border border-mt-street hover:border-mt-yellow/50 px-3.5 py-3 rounded-xl text-left shadow-card">
                    <span className="text-xl flex-shrink-0">{ex.icon}</span>
                    <div className="flex-1 min-w-0">
                      <div className="text-[13px] text-ink-800 font-medium truncate">{ex.text}</div>
                      <span className="text-[11px] text-ink-400">{ex.tag}</span>
                    </div>
                    <Icons.ChevronRight className="w-4 h-4 text-ink-300 flex-shrink-0"/>
                  </button>
                ))}
              </div>
            </div>
          </div>
          <footer className="text-center py-4 text-[11px] text-ink-400">美团黑客松 · Along-way Team</footer>
        </div>
      );
    }

    // ─── RESULT PAGE ───────────────────────────────────────────────
    function ResultPage({ result, onBack }) {
      const [mounted, setMounted] = useState(false);
      const [toastVisible, setToastVisible] = useState(false);
      const [toastMsg, setToastMsg] = useState('');
      useEffect(() => { setMounted(true); window.scrollTo({ top: 0, behavior: 'smooth' }); }, []);
      const { plan } = result;
      const { summary, route_overview, pois } = plan;
      const totalSaved = pois.reduce((sum, poi) => sum + poi.deals.reduce((s, d) => s + ((d.original_price || d.price) - d.price), 0), 0);

      const handleShare = () => {
        if (navigator.share) {
          navigator.share({ title: '顺路购路线', text: `从${summary.origin.name}到${summary.destination.name}，推荐${pois.length}个好店` }).catch(() => {});
        } else {
          navigator.clipboard?.writeText(`从${summary.origin.name}到${summary.destination.name}，推荐${pois.length}个好店，预计省¥${totalSaved.toFixed(0)}`).then(() => {
            setToastMsg('路线已复制到剪贴板');
            setToastVisible(true);
          }).catch(() => {
            setToastMsg('分享功能暂不可用');
            setToastVisible(true);
          });
        }
      };

      return (
        <div className="min-h-[calc(100dvh-56px)] pb-8">
          <div className="max-w-2xl mx-auto px-4 pt-4 space-y-5">
            {/* Map */}
            <section className={`transition-all duration-600 ${mounted ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-3'}`}>
              <MapView waypoints={route_overview.waypoints} segments={route_overview.segments}/>
            </section>

            {/* Summary (receipt style) */}
            <section className={`transition-all duration-600 ${mounted ? 'opacity-100 translate-y-0 delay-100' : 'opacity-0 translate-y-3'}`}>
              <div className="bg-white rounded-2xl border border-mt-street shadow-card p-4">
                <div className="flex items-center gap-2 mb-3">
                  <div className="w-1 h-4 rounded-full bg-mt-yellow"/>
                  <h3 className="text-sm font-semibold text-ink-800">路线小票</h3>
                </div>
                <RouteSummary summary={summary}/>
              </div>
            </section>

            {/* Savings banner */}
            {totalSaved > 0 && (
              <div className="rounded-2xl p-4 text-white flex items-center justify-between animate-fade-in-up border overflow-hidden relative" style={{animationDelay:'150ms', background:'linear-gradient(135deg, #17140F 0%, #332D26 100%)', borderColor:'rgba(255,209,0,0.3)'}}>
                <div className="absolute top-0 right-0 w-32 h-32 opacity-10" style={{background:'radial-gradient(circle, #FFD100, transparent 70%)'}}/>
                <div className="relative">
                  <div className="text-sm font-medium opacity-80">本次团购预计可省</div>
                  <div className="flex items-baseline gap-1 mt-0.5">
                    <span className="text-sm opacity-60">¥</span>
                    <span className="text-3xl font-bold font-mono text-mt-yellow">{totalSaved.toFixed(0)}</span>
                  </div>
                </div>
                <div className="relative text-right text-sm opacity-70">
                  <div>{pois.length} 个推荐点</div>
                  <div>{pois.reduce((s, p) => s + p.deals.length, 0)} 个团购</div>
                </div>
              </div>
            )}

            {/* POI list */}
            <section>
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center gap-2">
                  <div className="w-1 h-4 rounded-full bg-mt-yellow"/>
                  <h3 className="text-base font-semibold text-ink-900">途经推荐</h3>
                </div>
                <span className="text-xs text-ink-500 bg-mt-street/60 px-2.5 py-1 rounded-full font-medium">{pois.length} 个好店</span>
              </div>
              <div className="space-y-5">{pois.map((poi, i) => <POICard key={poi.poi_id} poi={poi} index={i}/>)}</div>
            </section>

            {/* Route detail (timeline style) */}
            <section className="animate-fade-in-up" style={{animationDelay:'400ms'}}>
              <div className="flex items-center gap-2 mb-3">
                <div className="w-1 h-4 rounded-full bg-mt-yellow"/>
                <h3 className="text-base font-semibold text-ink-900">路线详情</h3>
              </div>
              <div className="bg-white rounded-2xl border border-mt-street overflow-hidden">
                {route_overview.segments.map((seg, i) => {
                  const fromWp = route_overview.waypoints[seg.from], toWp = route_overview.waypoints[seg.to];
                  const isFirst = i === 0;
                  const isLast = i === route_overview.segments.length - 1;
                  return (
                    <div key={i} className="flex items-stretch">
                      {/* Timeline column */}
                      <div className="flex flex-col items-center w-10 flex-shrink-0 pt-4">
                        {isFirst && <div className="w-2.5 h-2.5 rounded-full bg-mt-city-green mb-1"/>}
                        <div className="w-px flex-1 bg-mt-street"/>
                        <div className="w-2 h-2 rounded-full bg-mt-yellow my-1"/>
                        {isLast && <div className="w-px flex-1 bg-mt-street mb-1"/>}
                        {isLast && <div className="w-2.5 h-2.5 rounded-full bg-mt-deal-red mt-1 mb-3"/>}
                      </div>
                      {/* Content */}
                      <div className="flex-1 py-3 pr-4 min-w-0">
                        <div className="text-sm font-medium text-ink-800">{seg.instruction}</div>
                        <div className="flex items-center gap-3 text-xs text-ink-400 mt-1">
                          <span>{fromWp.name} → {toWp.name}</span>
                          <span className="text-ink-300">·</span>
                          <span>{(seg.distance_m/1000).toFixed(1)}km</span>
                          <span className="text-ink-300">·</span>
                          <span>{seg.time_min}min</span>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </section>

            {/* Action buttons */}
            <div className="flex gap-3 pt-2 pb-4">
              <button onClick={onBack} className="flex-1 flex items-center justify-center gap-2 px-4 py-3 bg-white hover:bg-mt-rice border border-mt-street text-ink-800 font-medium rounded-xl transition-colors cursor-pointer btn-press">
                <Icons.ArrowLeft className="w-4 h-4"/>重新规划
              </button>
              <button onClick={handleShare}
                className="flex-1 flex items-center justify-center gap-2 px-4 py-3 bg-mt-yellow hover:bg-mt-yellow-dark text-ink-900 font-semibold rounded-xl transition-colors shadow-sm cursor-pointer btn-press">
                <Icons.Share className="w-4 h-4"/>分享路线
              </button>
            </div>
            <footer className="text-center text-[11px] text-ink-400 pb-2">美团黑客松 · Along-way Team</footer>
          </div>

          <Toast message={toastMsg} visible={toastVisible} onDone={() => setToastVisible(false)}/>
        </div>
      );
    }

    // ─── APP ───────────────────────────────────────────────────────
    function App() {
      const [state, setState] = useState('idle');
      const [result, setResult] = useState(null);
      const [error, setError] = useState(null);

      const handleSearch = useCallback(async (query, preferences) => {
        setState('loading');
        setError(null);
        try {
          const data = await submitPlan({ userQuery: query, travelMode: 'walking', preferences });
          if (data.success) { setResult(data); setState('result'); }
          else { setError(data.message || '规划失败，请重试'); setState('error'); }
        } catch (err) { setError(err.message || '网络错误，请检查后重试'); setState('error'); }
      }, []);

      const handleBack = useCallback(() => { setState('idle'); setResult(null); setError(null); }, []);
      const handleRetry = useCallback(() => { setState('idle'); setError(null); }, []);

      return (
        <div className="min-h-dvh bg-mt-rice relative">
          <ParticleField intensity={state === 'idle' ? 1 : 0.3}/>
          <div className="relative z-10">
            <Header showBack={state === 'result'} onBack={handleBack}/>
            {(state === 'idle' || state === 'loading') && <HomePage onSearch={handleSearch} loading={state === 'loading'}/>}
            {state === 'result' && result && <ResultPage result={result} onBack={handleBack}/>}
            {state === 'loading' && <LoadingOverlay/>}
            {state === 'error' && <ErrorMessage message={error} onRetry={handleRetry}/>}
          </div>
        </div>
      );
    }

    // ─── MOUNT ─────────────────────────────────────────────────────
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
