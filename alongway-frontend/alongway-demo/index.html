      '教学区':     { name: '教学区', longitude: 114.1290, latitude: 30.4630, address: '教学区' },
      '商业街':     { name: '商业街', longitude: 114.1260, latitude: 30.4590, address: '学校商业街' },
      '生活区':     { name: '生活区', longitude: 114.1250, latitude: 30.4584, address: '生活区' },

      '一食堂':     { name: '一食堂', longitude: 114.1290, latitude: 30.4630, address: '教学区旁' },
    };

    function generateUUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = (Math.random() * 16) | 0;
        return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
      });
    }

    function extractLocation(query) {
      for (const [name, loc] of Object.entries(LOCATION_MAP)) {
        if (query.includes(name)) return { ...loc, name: loc.name || name };
      }
      return null;
    }

    function defaultLocation(key) {
      const loc = LOCATION_MAP[key];
      return { ...loc, name: loc.name || key };
    }

    function rawLocation(name) {
      const cleaned = (name || '').replace(/^(我|我们|现在|当前位置|目前)\s*/, '').trim();
      return { name: cleaned || '未知地点', address: cleaned || '', location: cleaned || '' };
    }

    function toLocationPayload(loc) {
      const payload = {
        name: loc.name,
        address: loc.address || loc.name,
        location: loc.location || loc.name,
      };
      if (loc.longitude != null && loc.latitude != null) {
        payload.longitude = loc.longitude;
        payload.latitude = loc.latitude;
      }
      return payload;
    }

    async function submitPlan({ userQuery, travelMode = 'walking', budget, preferences }) {
      if (USE_MOCK) {
        await new Promise(r => setTimeout(r, 1800 + Math.random() * 1200));
        return MOCK_PLAN_RESULT;
      }

      const match = userQuery.match(/从(.+?)(?:到|去|→|前往)(.+)/);
      let start, end;
      if (match) {
        start = extractLocation(match[1]) || rawLocation(match[1]);
        end = extractLocation(match[2]) || rawLocation(match[2].split(/[，,。；;]/)[0]);
      } else {
        start = defaultLocation('学生宿舍');
        end = defaultLocation('图书馆');
      }

      const payload = {
        request_id: generateUUID(),
        user_query: userQuery,
        start_location: toLocationPayload(start),
        end_location: toLocationPayload(end),
        city: '武汉',
        travel_mode: travelMode,
        ...(budget && { budget }),
        ...(preferences && { preferences }),
      };

      const res = await fetch(`${BASE_URL}/api/plan`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || `请求失败 (${res.status})`);
      }
      return res.json();
    }

    function normalizeCoords(waypoints) {
      const lngs = waypoints.map(w => w.longitude), lats = waypoints.map(w => w.latitude);
      const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
      const minLat = Math.min(...lats), maxLat = Math.max(...lats);
      const padLng = (maxLng - minLng) * 0.2 || 0.01, padLat = (maxLat - minLat) * 0.2 || 0.01;
      const points = waypoints.map(w => ({
        ...w,
        x: 60 + ((w.longitude - minLng + padLng) / (maxLng - minLng + 2 * padLng)) * 480,
        y: 40 + (1 - (w.latitude - minLat + padLat) / (maxLat - minLat + 2 * padLat)) * 280,
      }));
      return spreadOverlappingPoints(points);
    }

    function spreadOverlappingPoints(points) {
      const groups = new Map();
      points.forEach((point, index) => {
        const key = `${Number(point.longitude).toFixed(6)},${Number(point.latitude).toFixed(6)}`;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push({ point, index });
      });

      const next = points.map(point => ({ ...point, overlapCount: 1, overlapIndex: 0 }));
      groups.forEach(group => {
        if (group.length <= 1) return;
        const radius = Math.min(26, 14 + group.length * 4);
        group.forEach(({ point, index }, offsetIndex) => {
          const angle = group.length === 2
            ? (-Math.PI / 2) + offsetIndex * Math.PI
            : (-Math.PI / 2) + offsetIndex * ((2 * Math.PI) / group.length);
          next[index] = {
            ...point,
            x: Math.max(24, Math.min(576, point.x + Math.cos(angle) * radius)),
            y: Math.max(24, Math.min(336, point.y + Math.sin(angle) * radius)),
            overlapCount: group.length,
            overlapIndex: offsetIndex,
          };
        });
      });
      return next;
    }

    function smoothPath(points) {
      if (points.length < 2) return '';
      let d = `M ${points[0].x} ${points[0].y}`;
      for (let i = 1; i < points.length; i++) {
        const prev = points[i-1], curr = points[i];
        const cpx1 = prev.x + (curr.x - prev.x) * 0.5, cpx2 = prev.x + (curr.x - prev.x) * 0.5;
        d += ` C ${cpx1} ${prev.y}, ${cpx2} ${curr.y}, ${curr.x} ${curr.y}`;
      }
      return d;
    }

              </div>
              <div className="mt-5">
                <p className="text-xs text-warm-muted mb-2.5 font-medium">偏好设置</p>
                <PreferenceTags preferences={preferences} onChange={setPreferences}/>
              </div>
            </form>

            {/* Examples */}
            <div className={`mt-8 w-full max-w-lg transition-all duration-700 ${mounted ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'}`} style={{transitionDelay:'400ms'}}>
              <p className="text-xs text-warm-muted mb-2.5 font-medium">试试这些</p>
              <div className="flex flex-wrap gap-2">
                {EXAMPLE_QUERIES.map((ex, i) => (
                  <button key={i} onClick={() => { setQuery(ex); inputRef.current?.focus(); }}
                    className="text-sm text-warm-muted hover:text-brand-600 bg-white hover:bg-brand-50 border border-warm-border hover:border-brand-200 px-3.5 py-2 rounded-xl transition-all duration-200 cursor-pointer">
                    {ex}
                  </button>
                ))}
              </div>
            </div>
          </div>
          <footer className="text-center py-4 text-xs text-warm-muted">美团黑客松 · Along-way Team</footer>
        </div>
      );
    }

    // ─── RESULT PAGE ────────────────────────────────────────────────
    function ResultPage({ result, onBack }) {
      const [mounted, setMounted] = useState(false);
      useEffect(() => { setMounted(true); window.scrollTo({ top: 0, behavior: 'smooth' }); }, []);
      const { plan } = result;
      const { summary, route_overview, pois } = plan;
      const totalSaved = pois.reduce((sum, poi) => sum + poi.deals.reduce((s, d) => s + ((d.original_price || d.price) - d.price), 0), 0);

      return (
        <div className="min-h-[calc(100dvh-56px)] pb-8">
          <div className="max-w-2xl mx-auto px-4 pt-4 space-y-5">
            <section className={`transition-all duration-600 ${mounted ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-3'}`}>
              <MapView waypoints={route_overview.waypoints} segments={route_overview.segments}/>
            </section>
            <section className={`transition-all duration-600 ${mounted ? 'opacity-100 translate-y-0 delay-100' : 'opacity-0 translate-y-3'}`}>
              <RouteSummary summary={summary}/>
            </section>
            {totalSaved > 0 && (
              <div className="bg-gradient-to-r from-brand-500 to-amber-500 rounded-2xl p-4 text-white flex items-center justify-between animate-fade-in-up" style={{animationDelay:'150ms'}}>
                <div><div className="text-sm font-medium opacity-90">本次团购预计可省</div><div className="text-2xl font-bold mt-0.5">¥{totalSaved.toFixed(0)}</div></div>
                <div className="text-right text-sm opacity-80"><div>{pois.length} 个推荐点</div><div>{pois.reduce((s, p) => s + p.deals.length, 0)} 个团购</div></div>
              </div>
            )}
            <section>
              <div className="flex items-center justify-between mb-4">
                <h3 className="text-base font-semibold text-warm-text">途经推荐</h3>
                <span className="text-xs text-warm-muted bg-warm-border/40 px-2.5 py-1 rounded-full">{pois.length} 个好店</span>
              </div>
              <div className="space-y-5">{pois.map((poi, i) => <POICard key={poi.poi_id} poi={poi} index={i}/>)}</div>
            </section>
            <section className="animate-fade-in-up" style={{animationDelay:'400ms'}}>
              <h3 className="text-base font-semibold text-warm-text mb-3">路线详情</h3>
              <div className="bg-white rounded-2xl border border-warm-border overflow-hidden divide-y divide-warm-border/60">
                {route_overview.segments.map((seg, i) => {
                  const fromWp = route_overview.waypoints[seg.from], toWp = route_overview.waypoints[seg.to];
                  return (
                    <div key={i} className="flex items-center gap-3 px-4 py-3 text-sm">
                      <div className="w-6 h-6 rounded-full bg-warm-bg border border-warm-border flex items-center justify-center text-[10px] font-bold text-warm-muted flex-shrink-0">{i+1}</div>
                      <div className="flex-1 min-w-0"><div className="text-warm-text font-medium truncate">{seg.instruction}</div><div className="text-xs text-warm-muted mt-0.5">{fromWp.name} → {toWp.name}</div></div>
                      <div className="text-right text-xs text-warm-muted flex-shrink-0"><div>{(seg.distance_m/1000).toFixed(1)}km</div><div>{seg.time_min}min</div></div>
                    </div>
                  );
                })}
              </div>
            </section>
            <div className="flex gap-3 pt-2 pb-4">
              <button onClick={onBack} className="flex-1 flex items-center justify-center gap-2 px-4 py-3 bg-white hover:bg-warm-bg border border-warm-border text-warm-text font-medium rounded-xl transition-colors cursor-pointer">
                <Icons.ArrowLeft className="w-4 h-4"/>重新规划
              </button>
              <button onClick={() => navigator.share?.({ title: '顺路购路线', text: `从${summary.origin.name}到${summary.destination.name}，推荐${pois.length}个好店` })}
                className="flex-1 flex items-center justify-center gap-2 px-4 py-3 bg-brand-500 hover:bg-brand-600 text-white font-medium rounded-xl transition-colors shadow-sm cursor-pointer">
                <Icons.Share className="w-4 h-4"/>分享路线
              </button>
            </div>
            <footer className="text-center text-xs text-warm-muted pb-2">美团黑客松 · Along-way Team</footer>
          </div>
        </div>
      );
    }

    // ─── APP ────────────────────────────────────────────────────────
    function App() {
      const [state, setState] = useState('idle');
      const [result, setResult] = useState(null);
      const [error, setError] = useState(null);

      const handleSearch = useCallback(async (query, preferences) => {
        setState('loading');
        setError(null);
        try {
          const data = await submitPlan({ userQuery: query, travelMode: 'walking', preferences });
          if (data.success) { setResult(data); setState('result'); }
          else { setError(data.message || '规划失败，请重试'); setState('error'); }
        } catch (err) { setError(err.message || '网络错误，请检查后重试'); setState('error'); }
      }, []);

      const handleBack = useCallback(() => { setState('idle'); setResult(null); setError(null); }, []);
      const handleRetry = useCallback(() => { setState('idle'); setError(null); }, []);

      return (
        <div className="min-h-dvh bg-warm-bg">
          <Header showBack={state === 'result'} onBack={handleBack}/>
          {(state === 'idle' || state === 'loading') && <HomePage onSearch={handleSearch} loading={state === 'loading'}/>}
          {state === 'result' && result && <ResultPage result={result} onBack={handleBack}/>}
          {state === 'loading' && <LoadingOverlay/>}
          {state === 'error' && <ErrorMessage message={error} onRetry={handleRetry}/>}
        </div>
      );
    }

    // ─── MOUNT ──────────────────────────────────────────────────────
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
